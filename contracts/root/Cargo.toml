[package]
name = "root"
description = "Token metadata, supply and epoch settlement across the trolls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Placeholder until the public repository exists; reproducible-build metadata links to it.
repository = "https://github.com/PLACEHOLDER-D6/sharded_trolls"

[package.metadata.near.reproducible_build]
# Build environment: the tag is descriptive only, the image is pinned by digest (cargo-near 0.23.0, Rust 1.100.0).
image = "sourcescan/cargo-near:0.23.0-rust-1.100.0"
image_digest = "sha256:265b662a03642196c8a1b97cb8e1bff9156488b584a9e040e9ef1f264e1049f1"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
troll-types.workspace = true
near-contract-standards.workspace = true
[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints]
workspace = true
